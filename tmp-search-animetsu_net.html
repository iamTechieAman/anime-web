    <style>
      #initial-loader {
        pointer-events: none;
        transition: opacity 0.5s ease;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        background: #000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .bar-track {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-indicator {
        width: 40px;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        border-radius: inherit;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-20px);
          width: 0px;
        }
        25% {
          width: 20px;
        }
        50% {
          width: 40px;
        }
        75% {
          width: 20px;
        }
        100% {
          transform: translateX(180px);
          width: 0px;
        }
      }
    </style>
